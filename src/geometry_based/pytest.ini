[pytest]
# Run from src/geometry_based:  conda run -n genai python -m pytest -q
# Approach-level tests only. Method-local legacy suites (methods/graph_transformer/test_graph_transformer.py,
# methods/finetuned_graph_transformer/test_finetuned_graph_transformer.py) run separately; see ../run_all_tests.py.
testpaths = tests methods/equi_collapse/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
