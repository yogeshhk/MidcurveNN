[pytest]
# Each approach (image_based, geometry_based, text_based) has its own pytest.ini, conftest.py and its own
# `common` / `methods` packages, so the three suites must run in SEPARATE processes. Use:
#     cd src
#     conda run -n genai python run_all_tests.py
# or run one approach: cd src/<approach> && conda run -n genai python -m pytest -q
# Running `pytest` from src/ collects nothing on purpose.
testpaths =
python_files = test_*.py
python_classes = Test*
python_functions = test_*
