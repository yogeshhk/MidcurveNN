[pytest]
# Run from src/image_based:  conda run -n genai python -m pytest -q
# Approach-level tests only. Method-local legacy suites (methods/*/test_*.py) and enhanced/tests are run
# separately because several old scripts define generic module names (config, utils); see ../run_all_tests.py.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
